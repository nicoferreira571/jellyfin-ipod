name: Build Jellyfin IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libplist-utils zip unzip xz-utils
          sudo apt-get install -y ldid || true
          if ! command -v ldid >/dev/null; then
            sudo curl -fL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi
          command -v ldid

      - name: Set up Theos (the iOS build kit)
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
